<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry 💔 Please Forgive Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.15;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.15;
      }
      90% {
        opacity: 0.15;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      z-index: 0;
      animation: orbFloat 8s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: #ff6b9d;
      top: -100px;
      left: -50px;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: #c084fc;
      bottom: -80px;
      right: -50px;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: #67e8f9;
      top: 50%;
      left: 60%;
      animation-delay: -5s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, -30px); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 60px 50px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: cardEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.8) translateY(30px);
    }

    @keyframes cardEntry {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .emoji-top {
      font-size: 5rem;
      margin-bottom: 10px;
      animation: bounce 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .question {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b9d, #c084fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      min-height: 70px;
      position: relative;
    }

    .btn-yes {
      padding: 16px 48px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b9d, #c084fc);
      color: white;
      box-shadow: 0 8px 30px rgba(255, 107, 157, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn-yes::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn-yes:hover::before {
      left: 100%;
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 40px rgba(255, 107, 157, 0.6);
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    .btn-no {
      padding: 16px 48px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.15s ease;
      position: fixed;
      z-index: 999;
      user-select: none;
    }

    /* Success screen */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .success-screen.show {
      display: flex;
    }

    @keyframes successPop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-emoji {
      font-size: 6rem;
      margin-bottom: 20px;
      animation: celebrate 0.5s ease-in-out infinite alternate;
    }

    @keyframes celebrate {
      0% { transform: rotate(-10deg) scale(1); }
      100% { transform: rotate(10deg) scale(1.1); }
    }

    .success-text {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399, #67e8f9, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .success-sub {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
    }

    .main-content.hidden {
      display: none;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-10vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg);
      }
    }

    /* Sparkle particles on hover of Yes */
    .sparkle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: sparkleFade 0.6s ease-out forwards;
    }

    @keyframes sparkleFade {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Tooltip that follows No button */
    .no-tooltip {
      position: fixed;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .no-tooltip.show {
      opacity: 1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 600px) {
      .card {
        padding: 40px 25px;
        border-radius: 24px;
        width: 92%;
        max-width: 380px;
      }

      .emoji-top {
        font-size: 3.5rem;
      }

      .question {
        font-size: 1.4rem;
        line-height: 1.4;
      }

      .subtitle {
        font-size: 0.85rem;
        margin-bottom: 30px;
      }

      .btn-yes {
        padding: 14px 32px;
        font-size: 1rem;
      }

      .btn-no {
        padding: 12px 32px;
        font-size: 1rem;
      }

      .success-emoji {
        font-size: 4rem;
      }

      .success-text {
        font-size: 1.5rem;
      }

      .success-sub {
        font-size: 0.95rem;
      }

      .orb-1 {
        width: 180px;
        height: 180px;
      }

      .orb-2 {
        width: 150px;
        height: 150px;
      }

      .orb-3 {
        width: 120px;
        height: 120px;
      }

      .no-tooltip {
        font-size: 0.7rem;
        padding: 5px 12px;
      }
    }

    @media (max-width: 380px) {
      .card {
        padding: 30px 18px;
        border-radius: 20px;
      }

      .emoji-top {
        font-size: 3rem;
      }

      .question {
        font-size: 1.2rem;
      }

      .subtitle {
        font-size: 0.8rem;
        margin-bottom: 25px;
      }

      .btn-yes {
        padding: 12px 24px;
        font-size: 0.9rem;
      }

      .btn-no {
        padding: 10px 24px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Main Card -->
  <div class="card" id="card">
    <div class="main-content" id="mainContent">
      <div class="emoji-top">🥺</div>
      <h1 class="question">I'm really sorry... Will you forgive me?</h1>
      <p class="subtitle">I know I messed up. Please give me another chance 🙏</p>
      <div class="buttons">
        <button class="btn-yes" id="btnYes" onclick="sayYes()">Yes, I forgive you 💖</button>
      </div>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="success-emoji">🥹</div>
      <h2 class="success-text">Thank you so much!</h2>
      <p class="success-sub">I promise I'll never make you upset again 💕🤞</p>
    </div>
  </div>

  <!-- The No button lives outside the card so it can roam freely -->
  <button class="btn-no" id="btnNo">No 😤</button>
  <div class="no-tooltip" id="noTooltip">Please don't say no! 🥺</div>

  <script>
    const btnNo = document.getElementById('btnNo');
    const noTooltip = document.getElementById('noTooltip');
    const card = document.getElementById('card');
    let escapeCount = 0;

    const taunts = [
      "Please don't say no! 🥺",
      "I'm truly sorry! 😢",
      "Give me a chance! 🙏",
      "I didn't mean it! 💔",
      "Please forgive me! 😭",
      "Just click forgive! 💖",
      "I'll do better! 🤞",
      "Wrong button! Try forgive! 😏",
      "You know you want to forgive me 🥹",
      "I can't lose you! 😿"
    ];

    // Position the No button initially next to the card
    function initNoButton() {
      const cardRect = card.getBoundingClientRect();
      btnNo.style.left = (cardRect.left + cardRect.width / 2 + 60) + 'px';
      btnNo.style.top = (cardRect.top + cardRect.height - 120) + 'px';
    }

    window.addEventListener('load', () => {
      setTimeout(initNoButton, 900);
    });
    window.addEventListener('resize', initNoButton);

    function getRandomPosition() {
      const margin = 100;
      const btnW = btnNo.offsetWidth;
      const btnH = btnNo.offsetHeight;
      const maxX = window.innerWidth - btnW - margin;
      const maxY = window.innerHeight - btnH - margin;
      const x = Math.max(margin, Math.random() * maxX);
      const y = Math.max(margin, Math.random() * maxY);
      return { x, y };
    }

    function escapeButton() {
      escapeCount++;
      const pos = getRandomPosition();
      btnNo.style.left = pos.x + 'px';
      btnNo.style.top = pos.y + 'px';
      btnNo.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg)`;

      // Show taunt tooltip
      const taunt = taunts[escapeCount % taunts.length];
      noTooltip.textContent = taunt;
      noTooltip.style.left = (pos.x) + 'px';
      noTooltip.style.top = (pos.y - 40) + 'px';
      noTooltip.classList.add('show');
      setTimeout(() => noTooltip.classList.remove('show'), 1200);

      // Make Yes button grow until it fills the ENTIRE screen
      const yesBtn = document.getElementById('btnYes');
      const cardEl = document.getElementById('card');

      const isMobile = window.innerWidth <= 600;

      if (escapeCount >= 10) {
        // Full screen takeover
        yesBtn.style.position = 'fixed';
        yesBtn.style.top = '0';
        yesBtn.style.left = '0';
        yesBtn.style.width = '100vw';
        yesBtn.style.height = '100vh';
        yesBtn.style.borderRadius = '0';
        yesBtn.style.fontSize = isMobile ? '2rem' : '4rem';
        yesBtn.style.zIndex = '9999';
        yesBtn.style.transform = 'none';
        yesBtn.style.padding = '20px';
        yesBtn.style.display = 'flex';
        yesBtn.style.alignItems = 'center';
        yesBtn.style.justifyContent = 'center';
        yesBtn.style.boxShadow = 'none';
        yesBtn.style.background = 'linear-gradient(135deg, #ff6b9d, #c084fc, #ff6b9d)';
        yesBtn.style.backgroundSize = '200% 200%';
        yesBtn.style.animation = 'gradientShift 2s ease infinite';
        btnNo.style.display = 'none';
        noTooltip.style.display = 'none';
        cardEl.style.zIndex = '10000';
      } else {
        const growRate = isMobile ? 0.15 : 0.25;
        const scale = 1 + (escapeCount * growRate);
        const maxScale = isMobile ? 2.5 : 4;
        const fontSize = (isMobile ? 1 : 1.15) + (escapeCount * growRate);
        const maxFont = isMobile ? 2 : 3.5;
        const padding = (isMobile ? 12 : 16) + (escapeCount * (isMobile ? 4 : 6));
        const maxPad = isMobile ? 35 : 50;
        const maxPadX = isMobile ? 70 : 120;
        yesBtn.style.transform = `scale(${Math.min(scale, maxScale)})`;
        yesBtn.style.fontSize = `${Math.min(fontSize, maxFont)}rem`;
        yesBtn.style.padding = `${Math.min(padding, maxPad)}px ${Math.min(padding * 2.5, maxPadX)}px`;
        yesBtn.style.boxShadow = `0 ${8 + escapeCount * 4}px ${30 + escapeCount * 10}px rgba(255, 107, 157, ${Math.min(0.4 + escapeCount * 0.06, 0.95)})`;
      }
    }

    // Escape on hover, touch, and click
    btnNo.addEventListener('mouseenter', escapeButton);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeButton();
    });
    btnNo.addEventListener('click', (e) => {
      e.preventDefault();
      escapeButton();
    });
    // Also escape if mouse gets close (proximity detection)
    document.addEventListener('mousemove', (e) => {
      const rect = btnNo.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;
      const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);
      if (dist < 80) {
        escapeButton();
      }
    });

    // YES button click
    function sayYes() {
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('successScreen').classList.add('show');
      btnNo.style.display = 'none';
      noTooltip.style.display = 'none';
      launchConfetti();
      // Change background gradient
      document.body.style.background = 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)';
    }

    // Confetti
    function launchConfetti() {
      const colors = ['#ff6b9d', '#c084fc', '#67e8f9', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
      const shapes = ['circle', 'rect'];
      for (let i = 0; i < 120; i++) {
        setTimeout(() => {
          const piece = document.createElement('div');
          piece.classList.add('confetti-piece');
          const color = colors[Math.floor(Math.random() * colors.length)];
          const shape = shapes[Math.floor(Math.random() * shapes.length)];
          const size = Math.random() * 10 + 5;

          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.width = size + 'px';
          piece.style.height = shape === 'rect' ? size * 2 + 'px' : size + 'px';
          piece.style.borderRadius = shape === 'circle' ? '50%' : '3px';
          piece.style.background = color;
          piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
          piece.style.animationDelay = Math.random() * 0.5 + 's';

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4000);
        }, i * 20);
      }
    }

    // Floating hearts
    function createFloatingHearts() {
      const container = document.getElementById('heartsBg');
      const hearts = ['💔', '🥺', '🙏', '😢', '💖', '🤞', '💫'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 8 + 8) + 's';
        heart.style.animationDelay = (Math.random() * 10) + 's';
        heart.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
        container.appendChild(heart);
      }
    }
    createFloatingHearts();
  </script>
</body>
</html>
